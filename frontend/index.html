<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Cockpit Lite</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #14141f;
        --border: #2a2a3a;
        --text: #e0e0e0;
        --text-muted: #8888a0;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      #app {
        display: flex;
        flex-direction: column;
      }

      button {
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        transition: all 0.15s;
      }
      button:hover { border-color: var(--accent); }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      button.primary:hover { background: var(--accent-hover); }
      button.danger { border-color: var(--danger); color: var(--danger); }
      button.danger:hover { background: var(--danger); color: white; }

      input, textarea, select {
        font-family: inherit;
        font-size: 14px;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        outline: none;
      }
      input:focus, textarea:focus { border-color: var(--accent); }

      textarea {
        resize: vertical;
        min-height: 120px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 13px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }

      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge.pro { background: rgba(99, 102, 241, 0.2); color: var(--accent); }
      .badge.team { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
      .badge.plus { background: rgba(34, 197, 94, 0.16); color: var(--success); }
      .badge.api { background: rgba(136, 136, 160, 0.2); color: var(--text-muted); }
      .badge.free { background: rgba(136, 136, 160, 0.2); color: var(--text-muted); }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
