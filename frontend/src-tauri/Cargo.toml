[package]
name = "codex-cockpit-lite"
version = "0.1.0"
description = "Codex Cockpit Lite - Simplified Codex multi-account manager"
edition = "2021"

[lib]
name = "codex_cockpit_lite_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-shell = "2.3.4"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
url = "2.5"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
